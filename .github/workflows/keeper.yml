name: keeper
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
concurrency:
  group: keeper
  cancel-in-progress: false
jobs:
  settle:
    # set the repository variable KEEPER_ENABLED to "true" once the contract is live
    if: vars.KEEPER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ship-or-burn/keeper settle
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          CHAIN_ID: ${{ vars.CHAIN_ID || '1' }}
